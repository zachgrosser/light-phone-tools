name: Build APK

# Builds the tool into an installable file (APK) for a Light Phone III.
# Download it from this workflow run's "Artifacts" section on GitHub.
# The APK is a debug build signed with the SDK's public development key, for testing only.
# For a build that Light signs, submit the tool on dashboard.thelightphone.com.

on:
  push:
    paths:
      - 'tool/**'
      - 'sdk/**'
      - 'plugin/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build tool APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        # toolOnly skips Light's example tools and emulator, which we don't need here.
        run: ./gradlew :tool:assembleDebug -DlightSdk.toolOnly=true --stacktrace

      - name: Name the APK after the tool and version
        id: apk
        run: |
          id=$(sed -n 's/^id *= *"\(.*\)"/\1/p' tool/lighttool.toml)
          version=$(sed -n 's/^versionName *= *"\(.*\)"/\1/p' tool/lighttool.toml)
          name="${id}-${version}-debug"
          mkdir -p out
          cp tool/build/outputs/apk/debug/*.apk "out/${name}.apk"
          sha256sum "out/${name}.apk" | tee "out/${name}.apk.sha256"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: out/
          retention-days: 30
